# Matriz de experimentos S3-1 (kpis/experimentos.py). Rutas relativas a semanas/S3/Tyrone/codigo/.
escenario: centro_base          # sumo/centro_base.sumocfg (demanda por semilla en sumo/escenarios/)
penetracion: [0, 20, 50, 80]    # % de vehículos con app
clasificador: [umbral, rf]
semillas: [1, 2, 3]
duracion_s: 4500                # 15 min de warm-up + 60 min medidos
warmup_s: 900
# rf_v1.joblib no está en el repo (lo ignora git) y el contenedor no tiene sklearn 1.9.1: se usa
# rf_final de Pablo (origin/pablo/s4, SHA-256 1bdac0d7…) exportado a arrays de numpy.
modelo_rf: kpis/externo/rf_final.plano.npz
modelo_rf_joblib: kpis/externo/ia/modelos/rf_final.joblib
procesos: auto                  # min(os.cpu_count() - 1, 6); en esta máquina se usó --procesos 4
libsumo: true                   # SUMO dentro del proceso (sin socket): ~30 % más rápido (perfil S3-2 de Freddy)
timeout_corrida_s: 3600              # una corrida completa con 4 procesos en 4 núcleos tarda ~25–30 min
