# Servicio `visor` de Dokploy (2026-11-18):
# - e-sert.tesisucuenca.com/        → el visor (Traefik manda aquí todo menos /roadmap, /api y /ws)
# - …/visor/                        → el visor (también en demo.e-sert.tesisucuenca.com/visor)
# - …/app  → /visor/app/            → la app web (QR del visor)
server {
    listen 80;
    absolute_redirect off;            # detrás de Traefik (HTTPS): redirecciones relativas
    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    add_header Cache-Control "no-cache";
    location = /salud { return 200 'ok'; add_header Content-Type text/plain; }
    location = /visor { return 301 /visor/; }
    location /visor/ { try_files $uri $uri/ =404; }
    location /app { return 302 /visor/app/; }
    # el visor en la raíz: sus rutas son relativas (./js, ./datos, ./css)
    location / {
        root /usr/share/nginx/html/visor;
        try_files $uri $uri/ =404;
    }
}
