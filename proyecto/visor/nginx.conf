# Servicio `visor` de Dokploy: archivos estáticos en demo.e-sert.tesisucuenca.com/visor y la app web
# en /visor/app/ (Traefik manda /visor y /app aquí; el resto del dominio va al backend).
server {
    listen 80;
    absolute_redirect off;            # detrás de Traefik (HTTPS): redirecciones relativas
    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    location = /visor { return 301 /visor/; }
    location /visor/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    # QR de la app: demo.e-sert.tesisucuenca.com/app → /visor/app/
    location /app { return 302 /visor/app/; }
    location = /salud { return 200 'ok'; add_header Content-Type text/plain; }
}
