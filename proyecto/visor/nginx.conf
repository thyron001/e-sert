# Servicio `visor` de Dokploy: archivos estáticos en demo.e-sert.tesisucuenca.com/visor
# (Traefik manda /visor aquí; el resto del dominio va al backend).
server {
    listen 80;
    absolute_redirect off;            # detrás de Traefik (HTTPS): redirecciones relativas
    root /usr/share/nginx/html;
    location = /visor { return 301 /visor/; }
    location /visor/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location = /salud { return 200 'ok'; add_header Content-Type text/plain; }
}
