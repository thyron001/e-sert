{% extends "base.html" %}
{% block title %}{{ titulo }} — e-sert{% endblock %}

{% block content %}
<div class="doc">
  <div class="cr-tabs" style="position: static">
    {% for k, (archivo, t) in DOCS.items() %}
    <a class="cr-tab {{ 'activo' if k == clave else '' }}" href="{{ url_for('doc', clave=k) }}">{{ t }}</a>
    {% endfor %}
  </div>
  <div class="es-md">{{ cuerpo }}</div>
</div>
{% endblock %}
